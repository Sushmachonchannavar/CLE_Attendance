# ==============================================================================
# Nginx Reverse Proxy Configuration - CLE Society Staff Attendance System
# Server location: /etc/nginx/sites-available/cle-attendance.conf
# Symlink: /etc/nginx/sites-enabled/cle-attendance.conf
# ==============================================================================

# Define upstream Node.js Express backend
upstream cle_backend_upstream {
    server 127.0.0.1:5001;
    keepalive 32;
}

# ------------------------------------------------------------------------------
# 1. HTTP Server - Port 80 (Certbot ACME Challenge & HTTPS Redirection)
# ------------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name attendance.yourdomain.com; # <-- Replace with your actual domain or server IP

    # Allow Let's Encrypt certificate challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
        allow all;
    }

    # Redirect all HTTP requests to secure HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# ------------------------------------------------------------------------------
# 2. HTTPS Server - Port 443 (Production Web Application & API Proxy)
# ------------------------------------------------------------------------------
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name attendance.yourdomain.com; # <-- Replace with your actual domain

    # TLS Certificates (Configured by Let's Encrypt Certbot)
    ssl_certificate /etc/letsencrypt/live/attendance.yourdomain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/attendance.yourdomain.com/privkey.pem;

    # Modern TLS Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling for faster TLS handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self)" always;

    # Maximum upload file size (aligned with Multer 100MB OD document limit)
    client_max_body_size 100M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static Web Frontend (Vite build output)
    root /var/www/cle-attendance/frontend/dist;
    index index.html;

    # React Router SPA Single Page Application routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Assets caching (1 year for hashed Vite bundle assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Ensure index.html is never aggressively cached so updates appear instantly
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }

    # --------------------------------------------------------------------------
    # API Reverse Proxy to Node.js / Express Backend
    # --------------------------------------------------------------------------
    location /api/ {
        proxy_pass http://cle_backend_upstream;
        proxy_http_version 1.1;

        # Connection header
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Forward client information
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffer settings
        proxy_buffering on;
        proxy_buffer_size 16k;
        proxy_buffers 4 32k;
    }

    # Backend Health Check route
    location = /health {
        proxy_pass http://cle_backend_upstream/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Direct Mobile APK Download
    location /downloads/ {
        proxy_pass http://cle_backend_upstream/downloads/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # --------------------------------------------------------------------------
    # Security: Strict blocking of database files, environments, and hidden files
    # --------------------------------------------------------------------------
    location ~* \.(sqlite|sqlite-wal|sqlite-shm|db|bak|sql)$ {
        deny all;
        return 404;
    }

    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
        return 404;
    }

    location ~* (database|\.env|package\.json|package-lock\.json|backups) {
        deny all;
        return 404;
    }
}
