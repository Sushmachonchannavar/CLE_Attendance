name: Build Android Mobile APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Make Gradle Wrapper Executable
        run: chmod +x frontend/android/gradlew

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Build Web Production Bundle
        working-directory: frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'https://attendance.clesociety.edu.in/api' }}
          VITE_CAMPUS_LAT: ${{ secrets.VITE_CAMPUS_LAT || '16.426026' }}
          VITE_CAMPUS_LNG: ${{ secrets.VITE_CAMPUS_LNG || '74.589353' }}
        run: npm run build

      - name: Sync Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Copy & Rename APK
        run: |
          mkdir -p dist-apk
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk dist-apk/cle-attendance.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cle-attendance-apk
          path: dist-apk/cle-attendance.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-mobile
          name: CLE Attendance Mobile App v1.0.0
          body: |
            ## CLE Society Staff Attendance & Location System - Android APK
            
            ### Installation Instructions:
            1. Download `cle-attendance.apk` below directly to your Android device.
            2. Tap to open and install.
            3. Grant Location permission when prompted ("While using the app" / "Allow all the time").
            4. Log in using your registered mobile number and SMS OTP.
          files: dist-apk/cle-attendance.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
